---
# ============================================
# SSH KEYS
# ============================================

ssh_keys_exclusive: false
ssh_keys_state: present

ssh_keys_authorized:
  - user: ansible
    key_owners:
      - ansible

  - user: pytel
    key_owners:
      - jaroslav.korner

# ============================================
# One-time system updates
# ============================================

update_packages_autoremove: true

# ============================================
# PACKAGES
# ============================================

packages:
  - vim
  - nala
  - aptitude
  - git
  - curl
  - wget
  - tmux
  - cron
  - entr
  - vlc
  - gimp
  - gparted
  - p7zip-full
  - cmatrix
  - odt2txt
  - grsync
  - htop
  - cbonsai
  - ripgrep

snap_packages:
  - tpad
  - mission-center
  - code

ranger_devicons_enabled: false

# ============================================
# SMB MOUNTS
# ============================================

smb_shares:
  - name: "Data"
    mount_point: "/mnt/data"
    share_path: "//192.168.1.100/data"
    username: "smbuser"
    password: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      63363061616634653839306635393861643535336334336564346335666363623565386335373263
      3938343966666265393066353631613234313663386138630a663438306333663731656230363832
      31613139353933323565356464663731646561663330393163616563353139623133346562346239
      3233386362336164360a343731643265323839313636613766336165633661646461623862333366
      3539
    uid: "root"
    gid: "smb_share_users"
    dir_mode: "0770"
    file_mode: "0660"
