services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homepage-docker-proxy
    environment:
      # Allow read-only access to containers API
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
  
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    group_add:
      - "103"
    environment:
      - PUID=1108  # Unique UID for Homepage
      - PGID=2000  # Shared group
      - TZ=Europe/Prague
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.101:3000
    ports:
      - 3000:3000
    volumes:
      # Local configuration files
      - /opt/docker-stacks/homepage/config:/app/config
      # Přidáno: Propagace SMB mountů pro čtení místa na discích
      - /mnt/data:/mnt/data:ro
      - /mnt/movies:/mnt/movies:ro
      # Odstraněno: /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - docker-proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped